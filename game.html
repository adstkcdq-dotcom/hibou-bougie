<title>Hibou &amp; Bougie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: un seul écran qui défile. Barre du haut fixe, hibou, carte « Concentration », améliorations, matières.
   L'aide s'ouvre dans un panneau plein écran par-dessus. */
:root{
  --bg:#141a33; --panel:#1d2546; --panel2:#252f58; --line:#34407a;
  --fg:#efe8da; --muted:#a3abcf; --amber:#f2b134; --amber-d:#c98a1e;
  --star:#8fd3ff; --star-d:#4f9cc7; --leaf:#7fcf9a; --rose:#ef8a8a;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* barre du haut */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.cur{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;font-family:var(--f-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.cur svg{width:22px;height:22px;flex:none}
#lvlbox{margin-left:auto;display:flex;align-items:center;gap:8px}
#lvlbox b{font-family:var(--f-display);font-size:14px;font-weight:600;white-space:nowrap}
.bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .3s}
#xpwrap{width:56px}
.help{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 16px var(--f-display);cursor:pointer;flex:none}

main{display:flex;flex-direction:column;gap:22px;padding-block:14px 28px}

/* scène : une grande illustration SVG (400×480) qui montre chaque achat */
#scenebox{display:flex;flex-direction:column;gap:8px;align-items:center}
#scene{position:relative;width:min(100%,calc(64vh * 5 / 6));aspect-ratio:5/6;border-radius:24px;overflow:hidden;border:1px solid var(--line);user-select:none;background:#1b2040}
#scenesvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#owlbtn{pointer-events:none;position:absolute;left:25%;top:36%;width:50%;height:47%;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;border-radius:40%}
#scenesvg{touch-action:manipulation}
.hit{cursor:pointer}
@keyframes pop{0%{filter:brightness(1)}30%{filter:brightness(1.8) drop-shadow(0 0 6px #fff2b0)}100%{filter:brightness(1)}}
@keyframes ready{50%{filter:brightness(1.3) drop-shadow(0 0 3px #fff2b0)}}
@keyframes flare{50%{transform:scale(1.7,1.9)}}
@keyframes flash{30%{opacity:1}}
@keyframes flybook{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(110px,150px) rotate(320deg);opacity:0}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(-90px,50px);opacity:0}}
#scenesvg.r-bougie [data-v=bougie],#scenesvg.r-the [data-v=the],#scenesvg.r-lampe [data-v=lampe],#scenesvg.r-etagere [data-v=etagere],#scenesvg.r-chat [data-v=chat],#scenesvg.r-tour [data-v=tour]{animation:ready 2.2s ease-in-out infinite}
#scenesvg.a-bougie [data-v=bougie],#scenesvg.a-the [data-v=the],#scenesvg.a-lampe [data-v=lampe],#scenesvg.a-etagere [data-v=etagere],#scenesvg.a-chat [data-v=chat],#scenesvg.a-tour [data-v=tour]{animation:pop .7s ease-out}
#scenesvg.a-bougie .fl{animation:flare .35s ease-in-out 2}
#scenesvg.a-the .steam{animation-duration:.7s}
#scenesvg.a-lampe .cone{animation:flash .8s}
#scenesvg.a-chat .tail{animation-duration:.3s}
.flyb{transform-box:fill-box;animation:flybook .9s ease-in forwards}
.shoot{animation:shoot 1.1s ease-out forwards}
@keyframes ffly{0%,100%{transform:translate(0,0)}25%{transform:translate(18px,-14px)}50%{transform:translate(-8px,-28px)}75%{transform:translate(-22px,-6px)}}
.ff{pointer-events:none;animation:ffly 7s ease-in-out infinite,tw 1.8s ease-in-out infinite}
@keyframes gbob{50%{transform:translateY(-7px) rotate(4deg)}}
.gb{transform-box:fill-box;transform-origin:center;animation:gbob 3.4s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.orb{transform-box:view-box;animation:orbit 9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-120}}
.portal{animation:dash 5s linear infinite}
@keyframes flip{to{transform:rotate(180deg)}}
@keyframes spinx{50%{transform:translateX(-6px)}}
#scenesvg.a-sablier .hg{transform-box:fill-box;transform-origin:center;animation:flip .7s ease-in-out}
#scenesvg.a-globe .gland{animation:spinx .7s ease-in-out}
#scenesvg.a-lucioles .ff{animation-duration:1.2s,.3s}
#scenesvg.a-grimoire .gb{animation-duration:.5s}
#scenesvg.a-planetaire .orb{animation-duration:.8s}
#scenesvg.a-portail .portal{animation-duration:.6s}
#scenesvg.r-globe [data-v=globe],#scenesvg.r-sablier [data-v=sablier],#scenesvg.r-lucioles [data-v=lucioles],#scenesvg.r-grimoire [data-v=grimoire],#scenesvg.r-planetaire [data-v=planetaire],#scenesvg.r-portail [data-v=portail]{animation:ready 2.2s ease-in-out infinite}
#scenesvg.a-globe [data-v=globe],#scenesvg.a-sablier [data-v=sablier],#scenesvg.a-lucioles [data-v=lucioles],#scenesvg.a-grimoire [data-v=grimoire],#scenesvg.a-planetaire [data-v=planetaire],#scenesvg.a-portail [data-v=portail]{animation:pop .7s ease-out}
#owlsq{transform-box:fill-box;transform-origin:50% 100%;transition:transform .08s}
#owlsq.squish{transform:scale(1.05,.93)}
#owlbob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .9s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(.85,1.12) skewX(4deg)}}
.steam{animation:stm 3s ease-in-out infinite;opacity:0}
@keyframes stm{0%{opacity:0;transform:translateY(0)}40%{opacity:.6}100%{opacity:0;transform:translateY(-14px)}}
.tail{transform-box:fill-box;transform-origin:0 50%;animation:tail 2.6s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(-14deg)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.cone{animation:cone 4s ease-in-out infinite}
@keyframes cone{50%{opacity:.75}}
.aura{transform-box:fill-box;transform-origin:center;animation:aura 6s linear infinite}
@keyframes aura{to{transform:rotate(360deg)}}
.strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.strip span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.strip b{color:var(--fg);font-family:var(--f-display);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
#rankname{color:var(--amber);font-family:var(--f-display);font-weight:600}
.float{position:absolute;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--amber);text-shadow:0 2px 0 rgba(0,0,0,.4);animation:up .9s ease-out forwards;white-space:nowrap;z-index:2}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
#letter{position:absolute;width:50px;height:36px;border:0;padding:0;background:none;cursor:pointer;animation:drift 9s linear forwards;z-index:3}
@keyframes drift{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(-50px,-14px) rotate(6deg)}50%{transform:translate(-110px,6px) rotate(-6deg)}75%{transform:translate(-170px,-10px) rotate(6deg)}100%{transform:translate(-240px,0);opacity:0}}
.rankcard{background:linear-gradient(160deg,#33284a,#1d2546);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rankcard .top{display:flex;align-items:center;gap:12px}
.rankcard .txt b{font-size:17px}
.rankdots{display:flex;gap:4px}.rankdots i{flex:1;height:6px;border-radius:3px;background:var(--panel2)}.rankdots i.on{background:var(--amber)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.buy.up{background:var(--leaf);color:#0d2a17;box-shadow:0 3px 0 #4f9a68;font-size:12px;min-width:80px;padding:6px 8px}
.buy.up:disabled{background:var(--panel2);color:var(--muted);box-shadow:none}
.mul{color:var(--leaf);font-weight:800}
.look{color:var(--star)!important}
#veil{position:absolute;inset:0;background:rgba(14,18,40,.6);display:flex;flex-direction:column;align-items:center;padding-top:14px;pointer-events:none}
#veil b{font-family:var(--f-display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
#veil span{font-size:12px;color:var(--amber);font-weight:800}
#chips{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--amber);color:#2a1a05;font-variant-numeric:tabular-nums}
.chip.blue{background:var(--star);color:#08233a}

/* typographie & blocs */
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0;line-height:1.45}
.sect{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:14px;padding:12px 16px;font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--amber);color:#2a1a05;border-color:transparent;box-shadow:0 3px 0 var(--amber-d)}
.btn.main:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent}
.btn.ad{background:var(--star);color:#08233a;border-color:transparent;box-shadow:0 3px 0 var(--star-d)}
.btn.ad:disabled{background:var(--panel2);color:var(--muted);box-shadow:none}
.btn.big{width:100%;font-size:18px;padding:15px}
.btn svg{width:20px;height:20px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.two>*{flex:1 1 0;min-width:0}

/* carte concentration */
#goal{display:flex;align-items:center;gap:12px;background:var(--leaf);color:#0d2a17;border-radius:16px;padding:12px 14px;border:0;font:inherit;text-align:left;width:100%}
#goal .gi{width:34px;height:34px;border-radius:50%;background:#0d2a17;color:var(--leaf);display:grid;place-items:center;font:700 16px var(--f-display);flex:none}
#goal small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
#goal b{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25}
#goal span{display:block;font-size:12px;line-height:1.35;margin-top:2px}
#goal .gbar{height:5px;border-radius:3px;background:rgba(13,42,23,.2);margin-top:6px;overflow:hidden}
#goal .gbar i{display:block;height:100%;background:#0d2a17}
.lead{font-family:var(--f-display);font-size:20px;font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.lead em{font-style:normal;color:var(--amber)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money>div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.money b{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:16px}
.money b svg{width:22px;height:22px}
.money p{margin:0;font-size:13px;line-height:1.4;color:var(--muted)}
.money p strong{color:var(--fg)}
.skip{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}
.skip input{width:18px;height:18px;accent-color:var(--amber)}
#secbib,#sechibou,.dur{display:flex;align-items:center;gap:12px}
.dur .step-b{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:600 26px var(--f-display);cursor:pointer;flex:none}
.durv{flex:1;text-align:center;display:flex;flex-direction:column}
.durv b{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.durv span{color:var(--star);font-weight:800;font-size:13px}
#durrange{width:100%;accent-color:var(--amber);height:28px}
#mission .pick{justify-content:center}
#mission{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
#mission{background:linear-gradient(160deg,#2a3466,#1d2546);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .bar{height:8px}
.goalhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goalhead b{font-family:var(--f-display);font-weight:600;font-size:17px}
.prog{font-size:12px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.chest{display:flex;align-items:center;gap:10px;background:rgba(242,177,52,.12);border:1px dashed var(--amber);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.chest b{font-family:var(--f-display);font-weight:600}
.chest span{font-size:12px;color:var(--muted)}

/* liste d'améliorations */
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px}
.ico{width:40px;height:40px;flex:none;border-radius:11px;background:var(--panel2);display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.txt span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.txtbtn{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.txtbtn b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.txtbtn span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.txtbtn .eff{color:var(--fg);font-weight:700}
.txtbtn .eff em{font-style:normal;color:var(--leaf)}
.more{color:var(--star)!important;font-weight:800}
.ihead{display:flex;gap:14px;align-items:center}
.ihead .ico{width:64px;height:64px;border-radius:18px}
.ihead .ico svg{width:44px;height:44px}
.ihead p{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.35}
.facts{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fact{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact div{font-size:15px;line-height:1.45}
.fact strong{color:var(--amber);font-variant-numeric:tabular-nums}
.fact .st{color:var(--star)}
.fact .ok{color:var(--leaf)}
.ibtns{display:flex;flex-direction:column;gap:8px}
.ibtns .buy{width:100%;min-height:48px;font-size:16px}
.lv{color:var(--amber);font-family:var(--f-body);font-weight:800;font-size:11px;margin-left:4px}
.buy{flex:none;min-width:80px;border:0;border-radius:11px;padding:9px 10px;font-family:var(--f-display);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums;background:var(--amber);color:#2a1a05;box-shadow:0 3px 0 var(--amber-d)}
.buy.st{background:var(--star);color:#08233a;box-shadow:0 3px 0 var(--star-d)}
.buy svg{width:16px;height:16px}
.buy:active{transform:translateY(2px);box-shadow:none}
.buy:disabled{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 14px var(--f-display);padding:8px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--fg)}
.tiers{display:flex;gap:3px;margin-top:4px}
.tiers i{width:14px;height:5px;border-radius:3px;background:var(--panel2)}

/* matières */
.deck{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.dd{width:12px;height:36px;border-radius:6px;flex:none}
.due{flex:none;font-family:var(--f-display);font-weight:600;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--amber);color:#2a1a05}
.due.zero{background:var(--panel2);color:var(--muted)}
.mast{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--panel2);margin-top:6px}
.mast i{display:block;height:100%}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:0}

/* panneau plein écran */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#sheet[hidden]{display:none!important}
#shead{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
#shead h2{flex:1;min-width:0;font-size:18px}
.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;cursor:pointer;flex:none}
#sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sbody .wrap{display:flex;flex-direction:column;gap:16px;padding-block:16px 20px}
#sfoot{border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#sfoot .wrap{padding-block:12px 0}
#sfoot[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.flash{min-height:220px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.flash .q{font-family:var(--f-display);font-size:23px;font-weight:500;line-height:1.3}
.flash .a{color:var(--leaf);font-weight:800;font-size:19px;padding-top:12px;border-top:1px dashed var(--line)}
.tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--muted)}
input[type=text],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px;font:16px var(--f-body)}
textarea{min-height:90px;resize:vertical}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 12px;font:700 13px var(--f-body);cursor:pointer;display:flex;align-items:center;gap:6px}
.pick button i{width:10px;height:10px;border-radius:50%}
.pick button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cl{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cl .txt b{font-family:var(--f-body);font-weight:800;font-size:14px}
.pips{display:flex;gap:2px;margin-top:5px}.pips i{width:10px;height:4px;border-radius:2px;background:var(--panel2)}
.mini{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 8px;font:700 12px var(--f-body);cursor:pointer;flex:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--fg)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--amber);color:#2a1a05;font:700 15px var(--f-display);display:grid;place-items:center;flex:none}
.step b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block}
.earn{display:flex;gap:18px;justify-content:center;font-family:var(--f-display);font-size:24px;font-weight:600}
.earn span{display:flex;align-items:center;gap:5px}.earn svg{width:24px;height:24px}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:600}

#modal{position:fixed;inset:0;background:rgba(8,10,24,.7);display:grid;place-items:center;padding:20px;z-index:40}
#modal .card{max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
#modal h3{font-size:22px;color:var(--fg)}
#modal p{margin:0;color:var(--muted);line-height:1.45}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;z-index:50;max-width:90%;text-align:center;transition:opacity .3s;pointer-events:none}
@media (prefers-reduced-motion:reduce){#glow,.float{animation-duration:.01s}#letter{animation:none}}

 {id:'lunettes',n:'Lunettes',role:'Chaque toucher sur le hibou rapporte plus de plumes.',d:t=>`Touchers ×${(1+.5*t).toFixed(1)}`},
 {id:'echarpe',n:'Écharpe',role:'Toute ta bibliothèque produit plus de plumes.',d:t=>`Production ×${(1+.25*t).toFixed(2)}`},

const today=()=>new Date().toDateString(), yesterday=()=>new Date(Date.now()-864e5).toDateString();

// Diplômes : on recommence la bibliothèque, chaque diplôme donne +20 % pour toujours
const DIP_BASE=1e11;
const dipMult=()=>1+.2*(S.dip||0);
const dipGain=()=>Math.floor(Math.cbrt((S.run||0)/DIP_BASE));
const dipNext=()=>DIP_BASE*Math.pow(dipGain()+1,3);

function tapOwl(x,y){
 if(studying()){floatAt(x,y,'Chut… on se concentre');return}

const objReady=id=>now()-(lastUse[id]||0)>=OBJ_CD;
function useObj(id,x,y){
 const svg=$('scenesvg'),b=BUILD.find(z=>z.id===id);if(!b||!cnt(id))return;
 svg.classList.remove('a-'+id);void svg.getBBox?.();svg.classList.add('a-'+id);setTimeout(()=>svg.classList.remove('a-'+id),900);
 if(id==='etagere'){const r=S.rank||0,y0=r>=1?120:130;svg.insertAdjacentHTML('beforeend',`<rect class="flyb" x="60" y="${y0}" width="12" height="18" rx="2" fill="${BOOKC[Math.floor(Math.random()*6)]}"/>`);setTimeout(()=>svg.querySelector('.flyb')?.remove(),950)}
 if(id==='tour'){const wx=(S.rank||0)>=3?220:215;svg.insertAdjacentHTML('beforeend',`<path class="shoot" d="M${wx} 50l14 -8" stroke="#fff6c9" stroke-width="3" stroke-linecap="round"/>`);setTimeout(()=>svg.querySelector('.shoot')?.remove(),1150)}
 if(studying()){floatAt(x,y,'Chut… on se concentre');return}
 if(!objReady(id)){floatAt(x,y,`Encore ${Math.ceil((OBJ_CD-(now()-lastUse[id]))/1000)} s`);return}
 lastUse[id]=now();S.inter=(S.inter||0)+1;
 const g=Math.max(2,cnt(id)*unitProd(b)*30);gain(g);addXp(2);
 floatAt(x,y-18,OBJ_TXT[id]);setTimeout(()=>floatAt(x,y,'+'+fmt(g)),150);
}

 if(F.kind==='info'){const x=infoSheet();$('stitle').textContent=x.t;$('sinner').innerHTML=x.h;$('sfootin').innerHTML=x.f;$('sfoot').hidden=!x.f;refresh();return}
 $('stitle').textContent='Bienvenue à la bibliothèque';
 $('sinner').innerHTML=`<p class="lead">Le but : faire grandir la bibliothèque de ton hibou… <em>en te concentrant pour de vrai.</em></p>
  <div class="money">
   <div><b>${plIco}Plumes</b><p><strong>Comment les gagner :</strong> touche le hibou, et tes objets en produisent tout seuls.</p><p><strong>À quoi elles servent :</strong> acheter et améliorer des objets.</p></div>
   <div><b>${stIco}Étoiles</b><p><strong>Comment les gagner :</strong> concentre-toi avec le minuteur, pour la durée de ton choix.</p><p><strong>À quoi elles servent :</strong> agrandir la bibliothèque et équiper le hibou.</p></div>
  </div>
  <div class="steps">
   <div class="step"><span class="n">1</span><div><b>Lance le minuteur et concentre-toi</b><p class="sub">Pose ton téléphone et travaille. À la fin, tu gagnes des étoiles. Pendant ce temps, tes plumes sont triplées.</p></div></div>
   <div class="step"><span class="n">2</span><div><b>Pendant tes pauses, touche le hibou</b><p class="sub">Chaque toucher donne des plumes. Touche aussi les objets de ta bibliothèque quand ils brillent : chacun donne un bonus toutes les 30 secondes. Et attrape les lettres dorées qui passent.</p></div></div>
   <div class="step"><span class="n">3</span><div><b>Améliore tout</b><p class="sub">Chaque achat se voit dans la bibliothèque et sur le hibou. Plus tard, les diplômes te permettent de recommencer encore plus fort.</p></div></div>
  </div>
  <p class="sub">Pas sûr de quoi faire ? La carte verte <b>« Ton prochain objectif »</b> te le dit toujours.</p>`;
 $('sfootin').innerHTML=`<button class="btn main big" data-act="close">Jouer</button><label class="skip"><input type="checkbox" id="hidew" ${S.hideWelcome?'checked':''}> Ne plus afficher au lancement</label>`;$('sfoot').hidden=false;
}
document.addEventListener('change',e=>{if(e.target.id==='hidew'){S.hideWelcome=e.target.checked?1:0;save()}});

// ---------- actions ----------
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const act=b.dataset.act,ix=act.indexOf(':'),a=ix<0?act:act.slice(0,ix),arg=ix<0?'':act.slice(ix+1);
 switch(a){
  case 'gotop':window.scrollTo({top:0,behavior:'smooth'});return;
  case 'gostudy':$('mission').scrollIntoView({behavior:'smooth',block:'center'});return;
  case 'gobib':$('secbib').scrollIntoView({behavior:'smooth',block:'start'});return;
  case 'gohibou':$('sechibou').scrollIntoView({behavior:'smooth',block:'start'});return;
  case 'info':openSheet('info',arg);return;
  case 'help':openSheet('help');S.seenHelp=1;break;
  case 'close':closeSheet();break;
  case 'up':{const B=BUILD.find(x=>x.id===arg),c=upCost(B);if(S.pl<c||cnt(arg)<upNeed(B))return;S.pl-=c;S.bl=S.bl||{};S.bl[arg]=bl(arg)+1;addXp(15);toast(`${B.n} améliorée : production ×2 et nouveau look !`);break}
  case 'rank':{const r=S.rank||0,c=RANKCOST[r];if(r>=5||S.st<c)return;S.st-=c;S.rank=r+1;drawLib();addXp(30);modal('La bibliothèque s’agrandit !',`Tu passes au rang ${RANKS[r+1]}. Toute ta production est maintenant ×${rankMult(r+1)}.`);break}
  case 'bec':{const c=becCost();if(S.pl<c)return;S.pl-=c;S.u.bec=lv('bec')+1;addXp(3);break}
  case 'b':{const B=BUILD.find(x=>x.id===arg),c=bCost(B);if(S.pl<c)return;S.pl-=c;S.b[arg]=cnt(arg)+1;addXp(4);if(cnt(arg)===1)toast(`${B.n} : nouvel objet dans ta bibliothèque !`);break}
  case 'e':{const t=tr(arg),c=EQCOST[t];if(S.st<c)return;S.st-=c;S.e[arg]=t+1;drawOwl();toast(`${EQ.find(x=>x.id===arg).n} ${TIER[t+1]} équipé !`);addXp(10);break}
  case 'daily':{const n=S.daily.day===yesterday()?S.daily.n+1:1,s=dailyStars(n),p=dailyPl();S.daily={day:today(),n};S.st+=s;gain(p);addXp(20);modal('Coffre ouvert !',`Jour ${n} d’affilée : +${s} étoiles et +${fmt(p)} plumes. Reviens demain pour plus.`,{label:'Doubler avec une pub',give:()=>{S.st+=s;gain(p)},done:`Coffre doublé : +${s} étoiles et +${fmt(p)} plumes`});break}
  case 'dur':setDur((S.dur||25)+(+arg));save();return;
  case 'durset':setDur(+arg);save();return;
  case 'adboost':Ads.show(()=>{S.adEnd=Math.max(now(),S.adEnd||0)+AD_BOOST_MIN*60000;save();render();toast(`Plumes ×2 pendant ${AD_BOOST_MIN} minutes !`)});return;
  case 'adprivacy':Ads.privacyForm();return;
  case 'study':if(+arg<1){if(S.trial)return;S.trial=1}S.study={end:now()+(+arg)*60000,min:+arg};Notif.plan(S.study.end,+arg);toast('C’est parti ! Pose ton téléphone.');window.scrollTo({top:0,behavior:'smooth'});break;
  case 'stop':if(b.dataset.sure){S.study=null;Notif.cancel();toast('Minuteur arrêté, pas de récompense')}else{b.dataset.sure=1;b.textContent='Toque encore pour arrêter';return}break;
  case 'dip':{const g=dipGain();if(!g)return;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Toque encore pour confirmer';return}
   S.dip=(S.dip||0)+g;S.pl=0;S.run=0;S.b={};S.bl={};S.u.bec=0;addXp(50*g);drawScene(true);
   modal('Diplôme obtenu !',`Tu as maintenant ${S.dip} diplôme${S.dip>1?'s':''} : toute ta production est ×${dipMult().toFixed(1)} pour toujours. Ta bibliothèque recommence, en plus fort.`);window.scrollTo({top:0,behavior:'smooth'});break}
  case 'reset':if(b.dataset.sure){S=fresh();S.seenHelp=1;drawOwl();drawLib();toast('Nouvelle partie')}else{b.dataset.sure=1;b.textContent='Toque encore : tout sera effacé, sans bonus';return}break;
 }
 save();
 if($('sheet').hidden)render();else if(F.kind==='info')renderSheet();
});
function toast(t){const T=$('toast');T.textContent=t;T.hidden=false;T.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{T.style.opacity=0;setTimeout(()=>T.hidden=true,300)},2200)}
function modal(title,txt,ad){$('modalcard').innerHTML=`<h3>${title}</h3><p>${txt}</p>${ad&&adOk()?`<button class="btn ad" id="mad">▶ ${ad.label}</button>`:''}<button class="btn ${ad&&adOk()?'ghost':'main'}" id="mok">${ad&&adOk()?'Non merci':'Super'}</button>`;$('modal').hidden=false;$('mok').onclick=()=>{$('modal').hidden=true};
 if($('mad'))$('mad').onclick=()=>{$('modal').hidden=true;Ads.show(()=>{ad.give();save();render();toast(ad.done)})};$('mok').focus()}

// ---------- boucle ----------
let lastT=performance.now(),acc=0,wasStudy=false;
function hud(){
 $('plumes').textContent=fmt(S.pl);$('etoiles').textContent=fmt(S.st);$('lvl').textContent=S.lvl;
 $('xpbar').style.width=Math.min(100,S.xp/xpNeed(S.lvl)*100)+'%';
 $('ps').textContent=fmt(prod());$('pt').textContent='+'+fmt(tapVal());$('rankname').textContent=RANKS[S.rank||0];
 let c='';if(now()<S.lEnd)c+=`<span class="chip">×7 · ${Math.ceil((S.lEnd-now())/1000)} s</span>`;if(now()<(S.adEnd||0))c+=`<span class="chip blue">×2 · ${Math.ceil(((S.adEnd||0)-now())/60000)} min</span>`;
 $('chips').innerHTML=c;updGoal();
 {const svg=$('scenesvg');for(const b of BUILD)svg.classList.toggle('r-'+b.id,cnt(b.id)>0&&objReady(b.id)&&!studying())}
 const st=studying();$('veil').hidden=!st;
 if(st){const r=Math.ceil((S.study.end-now())/1000);$('studytime').textContent=`${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`}
}
function tick(t){
 const dt=Math.min(1,(t-lastT)/1000);lastT=t;gain(prod()*dt);
 if(S.study&&now()>=S.study.end)finishStudy();
 if(!!studying()!==wasStudy){wasStudy=!!studying();if($('sheet').hidden)render()}
 if(now()>nextLetter&&!$('letter')&&!studying()){spawnLetter();nextLetter=now()+40000+Math.random()*50000}
 acc+=dt;if(acc>.2){acc=0;hud();refresh()}
 requestAnimationFrame(tick);
}
function finishStudy(){const m=S.study.min,r=studyReward(m);S.study=null;S.st+=r;S.studies++;addXp(m<1?20:Math.round(m*8));save();render();modal('Minuteur terminé, bravo !',`Tu as gagné ${r} étoile${r>1?'s':''}. Fais une vraie pause de 5 minutes avant la suite.`)}
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

function start(){
 const away=Math.min((now()-S.last)/1000,8*3600);
 drawOwl();drawLib();render();hud();
 if(S.study&&now()>=S.study.end)finishStudy();
 else if(away>60&&prodBase()>0){const g=prodBase()*away*(.5+.1*tr('plume'));gain(g);modal('Bon retour !',`Pendant ton absence, ta bibliothèque a produit ${fmt(g)} plumes.`,{label:'Doubler avec une pub',give:()=>gain(g),done:`+${fmt(g)} plumes en plus`})}
 if(!S.hideWelcome){S.seenHelp=1;openSheet('help')}
 S.last=now();requestAnimationFrame(tick);
}
start();
if(NATIVE){Ads.init();
 try{const App=window.Capacitor.registerPlugin('App');
  App.addListener('backButton',()=>{if(!$('modal').hidden){$('modal').hidden=true;return}if(!$('sheet').hidden){closeSheet();return}App.minimizeApp()});
  let pausedAt=0;
  App.addListener('pause',()=>{pausedAt=now();save()});
  App.addListener('resume',()=>{lastT=performance.now();const away=pausedAt?Math.min((now()-pausedAt)/1000,8*3600):0;pausedAt=0;
   if(S.study&&now()>=S.study.end)finishStudy();
   else if(away>60&&prodBase()>0){const g=prodBase()*away*(.5+.1*tr('plume'));gain(g);save();modal('Bon retour !',`Pendant ton absence, ta bibliothèque a produit ${fmt(g)} plumes.`,{label:'Doubler avec une pub',give:()=>gain(g),done:`+${fmt(g)} plumes en plus`})}
   hud()})}catch(e){}}
})();
</script>
