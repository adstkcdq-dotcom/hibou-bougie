# Fabrique l'app Android (.aab signé) dans le cloud, à chaque modification ou à la demande.
name: Fabriquer l'app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Lire les identifiants AdMob
        run: |
          echo "ADMOB_APP_ID=$(node -p "require('./admob.config.json').appId")" >> "$GITHUB_ENV"
          echo "ADMOB_REWARDED_ID=$(node -p "require('./admob.config.json').rewardedId")" >> "$GITHUB_ENV"

      - name: Préparer le jeu et le projet Android
        run: |
          npm run build
          npx cap sync android

      - name: Déchiffrer la clé de signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secret KEYSTORE_PASSWORD absent : fabrication NON signée (impossible à envoyer sur Google Play)."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:KEYSTORE_PASSWORD
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Fabriquer le fichier .aab
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: hibou
        run: |
          [ -z "$ADMOB_APP_ID" ] && unset ADMOB_APP_ID
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Mettre les fichiers à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: hibou-bougie-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
